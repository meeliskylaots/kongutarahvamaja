<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Ruumi kasutamise leping | Kultuuripesa</title>
  <style>
    :root{--ink:#18312f;--muted:#64706e;--line:#dbe3df;--paper:#fff;--bg:#f5f7f4;--accent:#176f67;--good:#176f67;--error:#a53b32}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{width:min(820px,calc(100% - 28px));margin:0 auto}.top{padding:28px 0 16px}.brand{font-weight:800;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-weight:500}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,38px);box-shadow:0 10px 30px rgba(20,45,40,.06);margin-bottom:36px}
    h1{font-size:clamp(30px,6vw,48px);line-height:1.05;margin:8px 0 12px;letter-spacing:-.04em}h2{font-size:20px;margin:28px 0 8px}p{margin:8px 0}.muted{color:var(--muted)}
    .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.data{padding:14px;border:1px solid var(--line);border-radius:12px}.data small{display:block;color:var(--muted)}.data strong{display:block;margin-top:3px}
    .terms{white-space:pre-wrap;padding:14px;border-left:3px solid var(--line);background:#fafbf9;border-radius:0 10px 10px 0}
    label{display:block;margin-top:18px;font-weight:700}input[type=text]{width:100%;padding:12px;border:1px solid #bac7c3;border-radius:10px;font:inherit;margin-top:6px}
    .check{display:flex;gap:10px;align-items:flex-start;font-weight:500;padding:14px;background:#f7faf8;border:1px solid var(--line);border-radius:12px}.check input{margin-top:5px}
    button{border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 15px inherit;padding:13px 18px;cursor:pointer;margin-top:16px}button:disabled{opacity:.55;cursor:wait}
    .status{padding:13px 14px;border-radius:12px;background:#e9f5f1;margin:16px 0}.status.error{background:#fff0ee;color:var(--error)}
    .accepted{border:1px solid #b9d9cf;background:#edf8f4}.footer{color:var(--muted);font-size:13px;padding:0 0 30px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.card{border-radius:14px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top"><div class="brand">Kultuuripesa<small>ruumi kasutamise leping</small></div></div>
    <main id="root" class="card"><p class="muted">Laadin kokkulepet…</p></main>
    <div class="footer">See leht avaneb personaalse lingiga. Ära jaga linki teistega.</div>
  </div>
<script>
const API='https://script.google.com/macros/s/AKfycbzdFUJ4VLN_jjgX3KZsGDtwpU6cdBuLlRNGyZRodzIOktR2ZF6IuIGGMe_CV4rlnIe5/exec';
const root=document.getElementById('root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('et-EE',{style:'currency',currency:'EUR'});
const token=new URLSearchParams(location.search).get('token')||'';
function jsonp(params={}){return new Promise((resolve,reject)=>{const cb='kp_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({...params,callback:cb});const timer=setTimeout(()=>{delete window[cb];s.remove();reject(new Error('Teenuse vastus aegus.'))},25000);window[cb]=data=>{clearTimeout(timer);delete window[cb];s.remove();resolve(data)};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(new Error('Andmete laadimine ebaõnnestus.'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}
async function post(payload){const requestId='KRM-CONTRACT-'+crypto.randomUUID();await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,requestId})});for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,450+i*180));const r=await jsonp({action:'operationStatus',requestId});if(r?.pending)continue;if(!r?.ok)throw new Error(r?.error||'Toiming ebaõnnestus.');return r}throw new Error('Kinnituse salvestamise kontroll aegus.')}
function term(title,value){return value?'<h2>'+esc(title)+'</h2><div class="terms">'+esc(value)+'</div>':''}
function clientTypeLabel(value){const v=String(value||'').trim().toLowerCase();return v==='community'?'Kogukonnasõbralik kasutus':v==='commercial'?'Kommertskasutus':(value||'—')}
function bookingSnapshotHTML(s={}){const rows=[['Kasutuse liik',s.eventType||'—'],['Kliendi kirjeldus',s.description||'—'],['Kasutuse laad',clientTypeLabel(s.clientType)],['Valitud teenused',s.selectedServicesText||'Lisateenuseid ei valitud'],['Broneerimisel näidatud ruumihind',money(s.roomCost||0)],['Broneerimisel näidatud teenused',money(s.servicesTotal||0)],['Broneerimisel näidatud koguhind',money(s.estimatedTotal||0)]];return '<h2>Broneeringu algne sisend</h2><div class="grid">'+rows.map(([l,v])=>'<div class="data"><small>'+esc(l)+'</small><strong style="white-space:pre-wrap">'+esc(v)+'</strong></div>').join('')+'</div>'+(s.quoteNote?'<p class="muted">'+esc(s.quoteNote)+'</p>':'')}
function render(c){
  document.title=(c.houseName||'Rahvamaja')+' kokkulepe | Kultuuripesa';
  const status=c.status==='kinnitatud'
    ? '<div class="status accepted"><strong>Leping on kinnitatud.</strong>'+(c.acceptedAt?' Kinnitamise aeg: '+esc(new Intl.DateTimeFormat('et-EE',{dateStyle:'long',timeStyle:'short'}).format(new Date(c.acceptedAt)))+'.':'')+'</div>'
    : c.expired?'<div class="status error"><strong>See kinnitamislink on aegunud.</strong> Võta rahvamajaga ühendust, et saada uus kokkulepe.</div>':'';
  root.innerHTML='<span class="eyebrow">'+esc(c.houseName)+'</span><h1>Ruumi kasutamise leping</h1><p class="muted">Lepingu ID '+esc(c.id)+' · versioon '+esc(c.version)+'</p>'+status+
    '<div class="grid"><div class="data"><small>Klient</small><strong>'+esc(c.clientName)+'</strong></div><div class="data"><small>Ruum</small><strong>'+esc(c.roomName)+'</strong></div><div class="data"><small>Algus</small><strong>'+esc(c.date)+' '+esc(c.startTime)+'</strong></div><div class="data"><small>Lõpp</small><strong>'+esc(c.endDate||c.date)+' '+esc(c.endTime)+'</strong></div><div class="data"><small>Kokkulepitud hind</small><strong>'+money(c.price)+'</strong></div><div class="data"><small>Tingimuste versioon</small><strong>'+esc(c.termsVersion)+'</strong></div></div>'+bookingSnapshotHTML(c.bookingSnapshot||{})+
    term('Hinna märkus',c.priceNote)+term('Hinna sees',c.included)+term('Eritingimused',c.specialTerms)+term('Tühistamise tingimused',c.cancellationTerms)+term('Üldtingimused',c.generalTerms)+
    (c.canAccept?'<form id="acceptForm"><h2>Kinnita kokkulepe</h2><label>Kinnitaja nimi<input id="acceptedName" type="text" value="'+esc(c.clientName)+'" required maxlength="160" autocomplete="name"></label><label class="check"><input id="agree" type="checkbox" required><span>Olen lepingu ja selle tingimustega tutvunud ning nõustun nendega.</span></label><button id="acceptButton" type="submit">Kinnitan lepingu</button><div id="message" class="status" style="display:none"></div></form>':'');
  document.getElementById('acceptForm')?.addEventListener('submit',accept);
}
async function load(){if(!token){root.innerHTML='<span class="eyebrow">Kultuuripesa</span><h1>Ruumi kasutamise leping</h1><div class="status"><strong>See leht avaneb personaalse kinnitamislingi kaudu.</strong><br>Kui oled klient, ava rahvamaja saadetud e-kirjas olev link. Kui oled rahvamaja töötaja, koosta ja saada kokkulepe siseveebist.</div>';return}try{const r=await jsonp({action:'contractView',token});if(!r?.ok)throw new Error(r?.error||'Kokkulepet ei leitud.');render(r.contract)}catch(e){root.innerHTML='<div class="status error">'+esc(String(e.message||e))+'</div>'}}
async function accept(ev){ev.preventDefault();const btn=document.getElementById('acceptButton'),msg=document.getElementById('message');if(!document.getElementById('agree').checked)return;btn.disabled=true;msg.style.display='block';msg.classList.remove('error');msg.textContent='Salvestan kinnitust ja koostan PDF-i…';try{const r=await post({action:'acceptContract',token,accepted:true,acceptedName:document.getElementById('acceptedName').value.trim(),userAgent:navigator.userAgent});msg.textContent=r.message;await load()}catch(e){msg.classList.add('error');msg.textContent=String(e.message||e);btn.disabled=false}}
load();
</script>
</body>
</html>
